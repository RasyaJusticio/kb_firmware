name: RY Build

permissions:
  contents: write

on:
  push:
    tags:
      - "ry-*"

jobs:
  build:
    runs-on: ubuntu-latest

    container: ghcr.io/qmk/qmk_cli

    steps:
    - name: Disable safe.directory check
      run : git config --global --add safe.directory '*'

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        pip3 install -r requirements-dev.txt
        qmk setup --home .  --yes

    - name: Set output
      id: vars
      run: echo "tag=${GITHUB_REF#refs/*/ry-}" >> $GITHUB_OUTPUT

    - name: Build
      if: always()
      shell: 'bash {0}'
      env:
        RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
      run: |
        qmk userspace-compile
        for i in *.bin; do mv "$i" "${i%%.bin*}_$RELEASE_VERSION.bin"; done
        ls -al

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        prerelease: true
        files: |
          shortcut_bridge75_jsc_via_${{ steps.vars.outputs.tag }}.bin
          keyboards/shortcut/bridge75/jsc/shortcut_bridge75_jsc_via.json
